name: Rules test

on:
  push:
    paths: [firestore.rules, "tests/**", ".github/workflows/rules.yml"]
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx firebase emulators:exec --only firestore --project demo-dijla "node rules.test.mjs"
